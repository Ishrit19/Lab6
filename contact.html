<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Showcase | Contact</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>

        <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Car Showcase</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
            <div class="drawer-header">
                <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body">
                <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Models</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>
                </ul>
            </div>
            </dialog>
        </div>
        </nav>
    

<main class="container mt-5 mb-5">

    <h1 class="text-center mb-4">Contact Us</h1>

    <form>
        <div class="row g-4">
            <div class="col-12 md:col-6">
                <div class="form-field">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName">
                    <div class="form-text">Please enter your first name.</div>
                </div>
            </div>
            <div class="col-12 md:col-6">
                <div class="form-field">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName">
                    <div class="form-text">Please enter your last name.</div>
                </div>
            </div>


            <div class="col-12 md:col-6">
                <div class="form-field">
                  <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                  <div class="form-text">Please enter your email address.</div>
                </div>
            </div>


            <div class="col-12 md:col-6">
                <div class="form-field">
                    <label for="carInterest" class="form-label">Select Interest</label>
                    <select class="form-control" id="carInterest">
                    <option value="">Choose one...</option>
                    <option value="1">Porsche</option>
                     <option value="2">BMW</option>
                      <option value="3">Mercedes</option>
                    </select>
                </div>
            </div>


            <div class="col-12">
                <div class="form-field">
                 <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="4"></textarea>
                    <div class="form-text">Please enter your message.</div>
                </div>
            </div>

            <div class="col-12">
            <div class="form-field">
                 <input type="checkbox" id="consentCheck" class="check">
              <label for="consentCheck">I consent to the terms and conditions</label>
                </div>
            </div>

            <div class="col-12">
                <button type="submit" class="btn-solid theme-primary">
                  Send Message
              </button>
            </div>

        </div>
    </form>
      <footer class="text-center p-4">
    <p>© 2026 Car Showcase. All rights reserved.</p>
</footer>
</main>
</body>
</html>
